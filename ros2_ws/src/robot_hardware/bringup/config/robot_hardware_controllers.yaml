controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_drive_controller:
      type: ackermann_drive_controller/AckermannDriveController

ackermann_drive_controller:
  ros__parameters:
    command_topic: /cmd_vel
    steer_joint_names: ["front_left_steer_joint", "front_right_steer_joint"]
    drive_joint_names: ["front_left_wheel_joint", "front_right_wheel_joint", "rear_left_wheel_joint", "rear_right_wheel_joint"]
    command_timeout: 1.0